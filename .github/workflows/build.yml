name: Build kernel

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository with submodules (shallow clone)
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools and AArch64 cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python-is-python3 \
            git curl unzip wget zip zstd libssl-dev bison flex

          # Symlink pentru apelurile care caută 'python2'
          if ! command -v python2 &> /dev/null; then
            sudo ln -s $(which python3) /usr/local/bin/python2
          fi

      - name: Download prebuilt Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      # 2. Run your custom bash script
      - name: Build kernel
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Generate release version
        id: ts
        run: |
          echo "RELEASE_TS=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          : > version.txt
          echo "**Kernel version:** $(cat out/include/config/kernel.release)  " >> version.txt
          echo >> version.txt
          export KHASH="$(git rev-parse HEAD)"
          echo "**Kernel source:** [$KHASH](https://github.com/sh4dow6oy/android_kernel_samsung_a82xq/tree/$KHASH)" >> version.txt

          if [ "${{ github.event.inputs.release }}" = "true" ] && \
             [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo >> version.txt
            echo "**Changelog:**" >> version.txt
            echo >> version.txt
            printf "%b\n" "${{ github.event.inputs.changelog }}" >> version.txt
          fi

      # 3. Upload the generated boot.img
      - name: Upload release assets
        if: github.event.inputs.release
        run: |
          gh release create "${{ env.RELEASE_TS }}" \
            boot.img dtbo.img \
            --repo sh4dow6oy/android_kernel_samsung_a82xq \
            --title "S10LiteKernel-${{ env.RELEASE_TS }}" \
            --notes-file version.txt
        env:
          GH_TOKEN: ${{ secrets.S10.R5Q }}
